<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Play — Let's Learning English</title>
  <meta name="description" content="A cute English word quiz for little learners — match the picture to the word." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23ff6f61'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #3d3050;
      --ink-soft: #746789;
      --cream: #fffdf7;
      --coral: #ff6f61;
      --coral-deep: #df5245;
      --yellow: #ffd166;
      --mint: #8fd9c4;
      --lavender: #c9b6f5;
      --green: #2fa84f;
      --red: #e5484d;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 88px 20px 32px;
      font-family: "Comic Sans MS", "Comic Neue", "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.85) 0, rgba(255, 255, 255, 0) 32%),
        radial-gradient(circle at 88% 82%, rgba(255, 255, 255, 0.7) 0, rgba(255, 255, 255, 0) 30%),
        linear-gradient(160deg, #dff3ff 0%, #fff8e7 48%, #ffe9f2 100%);
      overflow-x: hidden;
    }

    .topbar {
      position: absolute;
      top: 22px;
      left: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.9);
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(120, 90, 140, 0.12);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .back-link:hover {
      background: #fff;
      transform: translateY(-2px);
    }

    .topbar-brand {
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.55);
      padding: 7px 14px;
      border-radius: 999px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 740px;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 253, 247, 0.92);
      border: 4px solid #fff;
      border-radius: 38px;
      padding: clamp(24px, 5vw, 48px);
      box-shadow: 0 26px 70px rgba(120, 90, 140, 0.2);
    }

    .screen { width: 100%; }
    .screen[hidden] { display: none; }

    .screen:not([hidden]) {
      animation: pop-in 0.4s cubic-bezier(0.2, 0.9, 0.35, 1.15) both;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(14px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- Home ---------- */

    .home {
      position: relative;
      text-align: center;
      padding: 32px 8px;
    }

    .home h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 36px;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-shadow: 0 3px 0 #fff, 0 6px 0 rgba(255, 209, 102, 0.55);
    }

    .home h1 .rainbow {
      background: linear-gradient(90deg, #ff6f61, #ffa94d, #ffd43b, #5ec99c, #6cb2ff, #b59cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }

    .floater {
      position: absolute;
      font-size: clamp(2rem, 6vw, 3rem);
      user-select: none;
      pointer-events: none;
      animation: bob 3.4s ease-in-out infinite;
    }

    .f1 { top: 6%; left: 4%; animation-delay: 0s; }
    .f2 { top: 4%; right: 5%; animation-delay: 0.7s; }
    .f3 { bottom: 16%; left: 9%; animation-delay: 1.4s; }
    .f4 { bottom: 12%; right: 8%; animation-delay: 2.1s; }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }

    .start-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 66px;
      font-family: inherit;
      font-size: clamp(1.3rem, 4vw, 1.6rem);
      font-weight: 700;
      color: #fff;
      background: var(--coral);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 7px 0 var(--coral-deep), 0 16px 28px rgba(255, 111, 97, 0.35);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 0 var(--coral-deep), 0 20px 32px rgba(255, 111, 97, 0.38);
    }

    .start-btn:active {
      transform: translateY(3px);
      box-shadow: 0 4px 0 var(--coral-deep), 0 10px 18px rgba(255, 111, 97, 0.3);
    }

    .start-btn .play-icon {
      font-size: 1.1em;
      line-height: 1;
    }

    /* ---------- Quiz ---------- */

    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .progress-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
    }

    .progress-dots {
      display: flex;
      gap: 9px;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ebe3f5;
      border: 2px solid #fff;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .dot.is-done { background: var(--mint); }
    .dot.is-current { background: var(--coral); transform: scale(1.25); }

    .image-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 330px;
      margin: 0 auto 18px;
      padding: 10px;
      border-radius: 28px;
      background: linear-gradient(145deg, #fff4d6, #ffe4ef);
      border: 4px solid #fff;
      box-shadow: 0 12px 26px rgba(120, 90, 140, 0.14);
    }

    .image-frame img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 20px;
      animation: floaty 4s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .question-prompt {
      margin: 0 0 20px;
      text-align: center;
      font-size: clamp(1.4rem, 4.5vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 14px 44px;
      font-family: inherit;
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 3px solid #ece2d3;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 5px 0 #e6dbc9;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .option:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: var(--yellow);
      box-shadow: 0 8px 0 #f0c75e;
    }

    .option:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #e6dbc9;
    }

    .option:disabled { cursor: default; }

    .option-mark {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.65em;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .option.is-wrong {
      background: #ffeded;
      border-color: #f4a6a8;
      box-shadow: 0 5px 0 #f0b9bb;
      animation: shake 0.35s ease;
    }

    .option.is-wrong .option-mark {
      color: var(--red);
      opacity: 1;
    }

    .option.is-correct {
      background: #e8f9ed;
      border-color: #8fd7a5;
      box-shadow: 0 5px 0 #a8e2ba;
      animation: happy-pop 0.4s ease;
    }

    .option.is-correct .option-mark {
      color: var(--green);
      opacity: 1;
      transform: translateY(-50%) scale(1.15);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(4px); }
    }

    @keyframes happy-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .feedback {
      min-height: 1.6em;
      margin: 18px 0 0;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink-soft);
    }

    .feedback.is-good { color: var(--green); }
    .feedback.is-bad { color: var(--red); }

    /* ---------- Victory ---------- */

    .win {
      position: relative;
      text-align: center;
      padding: 18px 8px 8px;
    }

    .win-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 118px;
      height: 118px;
      margin-bottom: 18px;
      font-size: 3.6rem;
      background: linear-gradient(145deg, #fff1b8, #ffd166);
      border: 5px solid #fff;
      border-radius: 50%;
      box-shadow: 0 14px 30px rgba(255, 180, 60, 0.35);
      animation: badge-bounce 1.4s ease-in-out infinite;
    }

    @keyframes badge-bounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .win h2 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 3rem);
      color: var(--coral);
      text-shadow: 0 3px 0 #fff;
    }

    .win p {
      margin: 0 0 22px;
      font-size: 1.1rem;
      color: var(--ink-soft);
    }

    .word-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .word-chip {
      padding: 10px 22px;
      font-size: 1.15rem;
      font-weight: 700;
      background: #fff;
      border: 3px solid var(--lavender);
      border-radius: 999px;
      box-shadow: 0 5px 0 #ded0fb;
      animation: pop-in 0.45s ease both;
    }

    .word-chip:nth-child(2) { animation-delay: 0.12s; }
    .word-chip:nth-child(3) { animation-delay: 0.24s; }

    .again-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px 40px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      background: var(--mint);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #5fbba3, 0 14px 24px rgba(95, 187, 163, 0.32);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .again-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 0 #5fbba3, 0 18px 28px rgba(95, 187, 163, 0.35);
    }

    .again-btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #5fbba3, 0 10px 18px rgba(95, 187, 163, 0.3);
    }

    /* ---------- Confetti ---------- */

    .confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 50;
    }

    .confetti-piece {
      position: absolute;
      top: -24px;
      border-radius: 3px;
      opacity: 0.9;
      animation-name: confetti-fall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(108vh) rotate(720deg); opacity: 0.9; }
    }

    /* ---------- Focus & motion ---------- */

    button:focus-visible,
    a:focus-visible {
      outline: 4px solid #6cb2ff;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .confetti { display: none; }
    }

    @media (max-width: 600px) {
      body { padding: 76px 14px 22px; }
      .stage { border-radius: 28px; min-height: 0; padding: 24px 18px 28px; }
      .topbar { top: 14px; left: 14px; right: 14px; }
      .topbar-brand { display: none; }
      .image-frame { max-width: 240px; margin-bottom: 14px; }
      .options { gap: 10px; }
      .option { min-height: 62px; padding: 12px 34px; }
      .option-mark { right: 10px; font-size: 1.4em; }
      .floater { font-size: 1.8rem; opacity: 0.85; }
      .home h1 { margin-bottom: 28px; }
      .start-btn { padding: 16px 52px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="back-link" href="projects.html">&#8592; All projects</a>
    <span class="topbar-brand">Shao Yuya &middot; Word Play</span>
  </header>

  <main class="stage">

    <!-- Home screen: the only screen visible before Start -->
    <section class="screen home" id="screen-home">
      <span class="floater f1" aria-hidden="true">&#127822;</span>
      <span class="floater f2" aria-hidden="true">&#128054;</span>
      <span class="floater f3" aria-hidden="true">&#128064;</span>
      <span class="floater f4" aria-hidden="true">&#11088;</span>

      <h1>Let's learning <span class="rainbow">English</span></h1>

      <button class="start-btn" id="start-btn" type="button">
        <span class="play-icon" aria-hidden="true">&#9654;</span>
        Start
      </button>
    </section>

    <!-- Quiz screen: shows one question at a time -->
    <section class="screen quiz" id="screen-quiz" hidden>
      <div class="quiz-top">
        <span class="progress-text" id="progress-text">Word 1 of 3</span>
        <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
      </div>

      <div class="image-frame">
        <img id="question-image" src="1.jpg" alt="An apple" width="560" height="560" />
      </div>

      <h2 class="question-prompt" id="question-prompt">What is this?</h2>

      <div class="options" id="options"></div>

      <p class="feedback" id="feedback" aria-live="polite"></p>
    </section>

    <!-- Victory screen: hidden until question 3 is answered correctly -->
    <section class="screen win" id="screen-win" hidden>
      <div class="win-badge" aria-hidden="true">&#127942;</div>
      <h2>You did it!</h2>
      <p>You learned three new English words.</p>
      <div class="word-chips">
        <span class="word-chip">apple</span>
        <span class="word-chip">dog</span>
        <span class="word-chip">eye</span>
      </div>
      <button class="again-btn" id="again-btn" type="button">
        <span aria-hidden="true">&#8635;</span>
        Play again
      </button>
    </section>

  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    (function () {
      var QUESTIONS = [
        {
          src: '1.jpg',
          alt: 'An apple',
          answer: 'apple',
          distractors: ['banana', 'pear', 'grape']
        },
        {
          src: '2.jpg',
          alt: 'A dog',
          answer: 'dog',
          distractors: ['cat', 'mouse', 'bird']
        },
        {
          src: '3.jpg',
          alt: 'An eye',
          answer: 'eye',
          distractors: ['hand', 'foot', 'nose']
        }
      ];

      var screens = {
        home: document.getElementById('screen-home'),
        quiz: document.getElementById('screen-quiz'),
        win: document.getElementById('screen-win')
      };

      var startBtn = document.getElementById('start-btn');
      var againBtn = document.getElementById('again-btn');
      var optionsEl = document.getElementById('options');
      var feedbackEl = document.getElementById('feedback');
      var imageEl = document.getElementById('question-image');
      var progressText = document.getElementById('progress-text');
      var progressDots = document.getElementById('progress-dots');
      var confettiEl = document.getElementById('confetti');

      var current = 0;
      var locked = false;
      var advanceTimer = null;

      function showScreen(name) {
        Object.keys(screens).forEach(function (key) {
          screens[key].hidden = (key !== name);
        });
      }

      function shuffle(list) {
        var arr = list.slice();
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
        return arr;
      }

      function buildDots() {
        progressDots.innerHTML = '';
        for (var i = 0; i < QUESTIONS.length; i++) {
          var dot = document.createElement('span');
          dot.className = 'dot';
          progressDots.appendChild(dot);
        }
      }

      function updateDots() {
        var dots = progressDots.children;
        for (var i = 0; i < dots.length; i++) {
          dots[i].className = 'dot' +
            (i < current ? ' is-done' : '') +
            (i === current ? ' is-current' : '');
        }
      }

      function renderQuestion() {
        var question = QUESTIONS[current];
        locked = false;
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';

        imageEl.src = question.src;
        imageEl.alt = question.alt;
        progressText.textContent = 'Word ' + (current + 1) + ' of ' + QUESTIONS.length;
        updateDots();

        optionsEl.innerHTML = '';
        var choices = shuffle([question.answer].concat(question.distractors));

        choices.forEach(function (word) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option';
          btn.setAttribute('data-word', word);

          var label = document.createElement('span');
          label.className = 'option-word';
          label.textContent = word;

          var mark = document.createElement('span');
          mark.className = 'option-mark';
          mark.setAttribute('aria-hidden', 'true');

          btn.appendChild(label);
          btn.appendChild(mark);

          btn.addEventListener('click', function () {
            handleAnswer(btn, word);
          });

          optionsEl.appendChild(btn);
        });
      }

      function lockAllOptions() {
        var buttons = optionsEl.querySelectorAll('.option');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].disabled = true;
        }
      }

      function handleAnswer(btn, word) {
        if (locked) return;

        var question = QUESTIONS[current];

        if (word === question.answer) {
          locked = true;
          btn.classList.add('is-correct');
          btn.querySelector('.option-mark').textContent = '\u2713';
          feedbackEl.textContent = 'Yes! It\u2019s \u201c' + word + '\u201d!';
          feedbackEl.className = 'feedback is-good';
          lockAllOptions();

          var isLast = (current === QUESTIONS.length - 1);
          advanceTimer = setTimeout(function () {
            if (isLast) {
              launchConfetti();
              showScreen('win');
            } else {
              current++;
              renderQuestion();
            }
          }, 1100);
        } else {
          btn.classList.add('is-wrong');
          btn.querySelector('.option-mark').textContent = '\u2717';
          btn.disabled = true;
          feedbackEl.textContent = 'Not quite \u2014 try again!';
          feedbackEl.className = 'feedback is-bad';
        }
      }

      function launchConfetti() {
        var colors = ['#ff6f61', '#ffd166', '#8fd9c4', '#b59cff', '#ff9fc7', '#6cb2ff'];
        confettiEl.innerHTML = '';
        for (var i = 0; i < 40; i++) {
          var piece = document.createElement('span');
          piece.className = 'confetti-piece';
          piece.style.left = Math.random() * 100 + '%';
          piece.style.background = colors[i % colors.length];
          piece.style.width = (6 + Math.random() * 8) + 'px';
          piece.style.height = (10 + Math.random() * 10) + 'px';
          piece.style.animationDelay = (Math.random() * 0.9) + 's';
          piece.style.animationDuration = (2.2 + Math.random() * 1.4) + 's';
          confettiEl.appendChild(piece);
        }
        setTimeout(function () {
          confettiEl.innerHTML = '';
        }, 4500);
      }

      function startGame() {
        clearTimeout(advanceTimer);
        confettiEl.innerHTML = '';
        current = 0;
        showScreen('quiz');
        renderQuestion();
      }

      startBtn.addEventListener('click', startGame);
      againBtn.addEventListener('click', startGame);

      buildDots();

      // Preload the pictures so each question appears instantly.
      QUESTIONS.forEach(function (question) {
        var img = new Image();
        img.src = question.src;
      });
    })();
  </script>

</body>
</html>
